<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AARABHYATE | Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: var(--bg-base);
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }
    .auth-header { text-align: center; margin-bottom: var(--space-8); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="logo.png" alt="Aarabhyate Logo" style="height: 48px; width: auto; margin: 0 auto var(--space-4); display: block;">
        <h2 class="glitch-hover" style="width: fit-content; margin-inline: auto;">Create Account</h2>
        <p>Join the research group</p>
      </div>

      <!-- Step 1: Sign Up Form -->
      <form id="signupForm" class="form-group" style="gap: var(--space-4);">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" required placeholder="Dr. Alan Turing">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" required placeholder="alan@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
        
        <div class="form-error" id="signupError" style="margin-top:0; display:none"></div>
        
        <button type="submit" class="btn-primary btn" style="width: 100%; justify-content: center; margin-top: var(--space-4);">
          Register
        </button>
      </form>

      <!-- Step 2: OTP Verification Form -->
      <form id="otpForm" class="form-group hidden" style="gap: var(--space-4);">
        <p style="text-align:center; font-size:0.9rem; margin-bottom:var(--space-4); color:var(--text-secondary)">
          We sent a 6-digit verification code to your email.
        </p>
        <div class="form-group">
          <label class="form-label">Verification Code (OTP)</label>
          <input type="text" id="otp" class="form-input" required placeholder="123456" maxlength="6" style="text-align:center; font-family:var(--font-mono); font-size:1.5rem; letter-spacing:0.5rem;">
        </div>
        
        <div class="form-error" id="otpError" style="margin-top:0; display:none"></div>
        
        <button type="submit" class="btn-primary btn" style="width: 100%; justify-content: center; margin-top: var(--space-4); background: var(--neon-cyan); box-shadow: var(--glow-cyan);">
          Verify & Login
        </button>
      </form>

      <p style="text-align:center; margin-top:var(--space-6); font-size:0.85rem;">
        Already have an account? <a href="login.html" style="color:var(--neon-cyan); text-decoration:none;">Log in</a>
      </p>
    </div>
  </div>

  <script>
    let registeredEmail = '';

    // Step 1: Submit Registration
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('signupError');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        // Success! Hide signup form, show OTP form
        registeredEmail = email;
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('otpForm').classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });

    // Auto-redirect if already logged in
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("arg_token");
      if (token) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        if (redirectParam === 'checkout') {
          window.location.replace('/checkout.html');
        } else {
          // Decode JWT client-side safely without third-party library to check role
          try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const claims = JSON.parse(jsonPayload);
            if (claims.role === 'admin') {
              window.location.replace('/admin.html');
              return;
            }
          } catch (e) {
            console.error("Failed to decode token", e);
          }
          window.location.replace('/dashboard.html');
        }
      }
    });

    // Step 2: Verify OTP
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otp').value;
      const errorEl = document.getElementById('otpError');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: registeredEmail, otp_code: otp })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Verification failed');

        // Success! Save token and redirect
        localStorage.setItem('arg_token', data.token);
        
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (redirectParam === 'checkout') {
          window.location.replace('/checkout.html');
        } else if (data.user && data.user.role === 'admin') {
          window.location.replace('/admin.html');
        } else {
          window.location.replace('/dashboard.html');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
