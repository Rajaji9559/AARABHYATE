<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AARABHYATE | Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: var(--bg-base);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }
    .login-header { text-align: center; margin-bottom: var(--space-8); }
    .login-header .logo-mark {
      width: 48px; height: 48px; margin: 0 auto var(--space-4);
      border: 2px solid var(--neon-cyan); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-weight: 700; color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.png" alt="Aarabhyate Logo" style="height: 48px; width: auto; margin: 0 auto var(--space-4); display: block;">
        <h2 class="glitch-hover" style="width: fit-content; margin-inline: auto;">System Login</h2>
        <p>Authorized personnel only</p>
      </div>

      <form id="loginForm" class="form-group" style="gap: var(--space-4);">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" required placeholder="admin@aarabhyate.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
        
        <div class="form-error" id="errorMessage" style="margin-top:0"></div>
        
        <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; margin-top: var(--space-4); background: var(--neon-cyan); box-shadow: var(--glow-cyan);">
          Access System
        </button>
      </form>
    </div>
  </div>

  <script>
    // Auto-redirect if already logged in
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("arg_token");
      if (token) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        if (redirectParam === 'checkout') {
          window.location.replace('/checkout.html');
        } else {
          // Decode JWT client-side safely without third-party library to check role
          try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const claims = JSON.parse(jsonPayload);
            if (claims.role === 'admin') {
              window.location.replace('/admin.html');
              return;
            }
          } catch (e) {
            console.error("Failed to decode token", e);
          }
          window.location.replace('/dashboard.html');
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMessage');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed');

        // Save token and redirect based on role or query param
        localStorage.setItem('arg_token', data.token);
        
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (redirectParam === 'checkout') {
          window.location.replace('/checkout.html');
        } else if (data.user && data.user.role === 'admin') {
          window.location.replace('/admin.html');
        } else {
          window.location.replace('/dashboard.html');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
